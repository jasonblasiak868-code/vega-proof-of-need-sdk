[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-proof-of-need-sdk"
version = "0.1.0"
description = "Proof of need and proof of payment: a co-signed constitution, advisory need analysis, human-approved releases from a SIMULATED bankroll, institution receipts, and privacy-preserving proof of income."
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "vega-custody-sdk", "vega-governance-jacket-sdk", "vega-superproof-sdk", "vega-identity-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
